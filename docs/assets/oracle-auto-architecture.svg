<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Oracle Auto Architecture</title>
  <desc id="desc">Full-color architecture diagram for Oracle Install Replication Framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="42%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#e2e8f0"/>
    </marker>
    <style>
      .title { font: 800 44px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 800 23px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .small { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #e5e7eb; }
      .tiny { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: .08em; }
      .pill { font: 800 14px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .card { rx: 24; filter: url(#shadow); }
      .line { stroke: #e2e8f0; stroke-width: 4; fill: none; marker-end: url(#arrow); opacity: .9; }
      .soft { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.22); stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1180" cy="95" r="190" fill="#ef4444" opacity=".12"/>
  <circle cx="220" cy="720" r="210" fill="#38bdf8" opacity=".13"/>

  <text x="70" y="80" class="title">Oracle Install Replication Framework</text>
  <text x="70" y="115" class="subtitle">Config-driven automation for GI, ASM, Database, RAC, patching, and Active Data Guard</text>

  <rect x="70" y="150" width="210" height="48" rx="24" fill="url(#blue)"/>
  <text x="100" y="181" class="pill">OPERATOR / DBA</text>

  <rect x="345" y="145" width="250" height="118" class="card" fill="url(#purple)"/>
  <text x="375" y="185" class="label">Deployment Config</text>
  <text x="375" y="218" class="small">JSON / YAML</text>
  <text x="375" y="245" class="small">topology, storage, patch</text>

  <rect x="665" y="145" width="260" height="118" class="card" fill="url(#red)"/>
  <text x="695" y="185" class="label">CLI Cockpit</text>
  <text x="695" y="218" class="small">python main.py</text>
  <text x="695" y="245" class="small">validate, plan, execute</text>

  <rect x="995" y="145" width="300" height="118" class="card" fill="url(#amber)"/>
  <text x="1025" y="185" class="label">Plan &amp; Guardrails</text>
  <text x="1025" y="218" class="small">dry-run, approval flags</text>
  <text x="1025" y="245" class="small">HTML plan + shell runbook</text>

  <path d="M 280 174 L 338 204" class="line"/>
  <path d="M 595 204 L 656 204" class="line"/>
  <path d="M 925 204 L 986 204" class="line"/>

  <rect x="90" y="330" width="360" height="300" class="soft" rx="28"/>
  <text x="125" y="375" class="label">Framework Core</text>
  <rect x="125" y="405" width="280" height="44" rx="14" fill="#dbeafe"/>
  <text x="148" y="433" class="tiny">CONFIG VALIDATION</text>
  <rect x="125" y="465" width="280" height="44" rx="14" fill="#fef3c7"/>
  <text x="148" y="493" class="tiny">REMOTE PRECHECK</text>
  <rect x="125" y="525" width="280" height="44" rx="14" fill="#fee2e2"/>
  <text x="148" y="553" class="tiny">PHASE BUILDERS</text>
  <rect x="125" y="585" width="280" height="44" rx="14" fill="#dcfce7"/>
  <text x="148" y="613" class="tiny">STATE / RESUME</text>

  <rect x="520" y="330" width="360" height="300" class="card" fill="url(#blue)"/>
  <text x="555" y="375" class="label">Automation Runner</text>
  <text x="555" y="412" class="small">SSH execution</text>
  <text x="555" y="442" class="small">per-step result normalization</text>
  <text x="555" y="472" class="small">log capture</text>
  <text x="555" y="502" class="small">resume-aware workflow</text>
  <rect x="555" y="540" width="255" height="54" rx="18" fill="rgba(15,23,42,.35)" stroke="rgba(255,255,255,.25)"/>
  <text x="585" y="574" class="pill">DRY-RUN FIRST</text>

  <rect x="950" y="330" width="360" height="300" class="soft" rx="28"/>
  <text x="985" y="375" class="label">Target Oracle Estate</text>
  <rect x="985" y="405" width="280" height="44" rx="14" fill="#e0f2fe"/>
  <text x="1008" y="433" class="tiny">ORACLE LINUX BASELINE</text>
  <rect x="985" y="465" width="280" height="44" rx="14" fill="#ede9fe"/>
  <text x="1008" y="493" class="tiny">GRID INFRASTRUCTURE</text>
  <rect x="985" y="525" width="280" height="44" rx="14" fill="#fef9c3"/>
  <text x="1008" y="553" class="tiny">ASM / ASMFD STORAGE</text>
  <rect x="985" y="585" width="280" height="44" rx="14" fill="#dcfce7"/>
  <text x="1008" y="613" class="tiny">DATABASE + DATA GUARD</text>

  <path d="M 795 263 C 795 295 700 290 700 322" class="line"/>
  <path d="M 450 480 L 510 480" class="line"/>
  <path d="M 880 480 L 940 480" class="line"/>

  <rect x="120" y="695" width="270" height="62" rx="20" fill="url(#green)" filter="url(#shadow)"/>
  <text x="150" y="733" class="pill">HTML REPORT</text>
  <rect x="430" y="695" width="270" height="62" rx="20" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="460" y="733" class="pill">STATE JSON</text>
  <rect x="740" y="695" width="270" height="62" rx="20" fill="url(#amber)" filter="url(#shadow)"/>
  <text x="770" y="733" class="pill">PER-STEP LOGS</text>
  <rect x="1050" y="695" width="270" height="62" rx="20" fill="url(#red)" filter="url(#shadow)"/>
  <text x="1080" y="733" class="pill">DIAGNOSTICS</text>

  <path d="M 670 630 C 620 665 520 675 390 705" class="line"/>
  <path d="M 700 630 L 700 680 L 565 680 L 565 690" class="line"/>
  <path d="M 730 630 L 730 680 L 875 680 L 875 690" class="line"/>
  <path d="M 760 630 C 850 665 995 675 1160 695" class="line"/>
</svg>
